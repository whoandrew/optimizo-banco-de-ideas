<!doctype html>
<html lang="es" data-paleta="teal" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizo · Banco de ideas</title>
<meta name="description" content="Presentación interna para elegir o descartar las ideas de contenido de Optimizo rumbo al TechAI Summit.">
<link rel="icon" href="assets/optimizo-isotipo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="barra">
  <a class="marca" href="#1" aria-label="Optimizo, inicio">
    <img class="logo logo--claro" src="assets/optimizo-logo.svg" alt="Optimizo">
    <img class="logo logo--oscuro" src="assets/optimizo-logo-sobre-oscuro.svg" alt="" aria-hidden="true">
    <span class="marca__sub">banco de ideas</span>
  </a>
  <div class="cuenta" aria-live="polite">
    <span class="cuenta__item cuenta__item--si"><i></i><b id="tYes">0</b> elegidas</span>
    <span class="cuenta__item cuenta__item--no"><i></i><b id="tNo">0</b> descartadas</span>
    <span class="cuenta__item"><i></i><b id="tWait">0</b> pendientes</span>
  </div>
  <div class="avance"><i id="bar"></i></div>
</header>

<main id="deck" aria-label="Presentación"></main>

<nav class="dock ceramica" aria-label="Controles de la presentación">
  <button class="dock__flecha" id="prev" aria-label="Lámina anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="dock__centro">
    <span class="dock__titulo" id="dTitle">Portada</span>
    <span class="dock__n mono"><span id="cNow">01</span> / <span id="cTotal">00</span></span>
  </div>
  <button class="dock__flecha" id="next" aria-label="Lámina siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="dock__sep"></span>
  <div class="segmento" role="group" aria-label="Paleta">
    <button data-paleta="teal" class="on" title="Paleta A · Teal"><i class="mu mu--a"></i>A</button>
    <button data-paleta="naranjo" title="Paleta B · Mandarina"><i class="mu mu--b"></i>B</button>
  </div>
  <button class="dock__icono" id="tema" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro / oscuro">
    <svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
    <svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
  </button>
  <button class="dock__icono" id="full" aria-label="Pantalla completa" title="Pantalla completa (F)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</nav>

<div class="aviso papel" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
